{% extends "admin/base.html" %}
{% load static %}

{% block title %}
    {% if subtitle %} {{ subtitle }} | {% endif %}
    {{ title }} | {{ site_title }}
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root, html[data-theme="light"], html[data-theme="dark"]{
        --body-bg: #0F1A12;
        --header-bg: #000000;
        --primary: #1B5E20;
        --breadcrumbs-bg: #2E7D32;
        --selected-row: #1F3A24;
    }
        .module h2, .module caption {
        background: #1B5E20;
    }
</style>
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}">
        <img src="{% static 'imagini/Emblema.png' %}" alt="logo" height="40">
        {{ site_header }}
    </a>
</div>
{% endblock %}
